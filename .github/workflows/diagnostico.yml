name: Diagnóstico do servidor

# Olha o servidor sem mexer em nada: robôs de pé, reinícios, máquina, banco e
# volume de log. Roda de hora em hora e pode ser disparado à mão (aba Actions,
# "Run workflow"). Fica vermelho se um robô estiver fora do ar ou o disco
# passar de 90%; aí o GitHub manda e-mail.
#
# O repositório é público, e os logs do Actions também: aqui só saem estados e
# números, nunca o conteúdo dos logs dos robôs nem dados do banco. Os detalhes
# dos erros ficam no /status do bot, no privado.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Olhar o servidor (só leitura)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/shopee
            SERVICOS="bot_mestre_bot divulgacao_canal_bot motor_userbot_bot espelhador_videos_autorais_bot downloader_bot"
            ALERTA=0

            echo "== Versão no ar"
            git log -1 --format='%h  %cd  %s' --date=format:'%d/%m %H:%M'

            # Robô fora do ar no meio de um deploy volta em segundos: confere de
            # novo depois de 1 min antes de dar alarme.
            fora() {
              for S in $SERVICOS; do
                systemctl is-active --quiet "$S.service" || echo "$S"
              done
            }
            if [ -n "$(fora)" ]; then
              sleep 60
            fi
            CAIDOS="$(fora)"

            echo ""
            echo "== Robôs"
            for S in $SERVICOS; do
              ESTADO=$(systemctl show -p ActiveState --value "$S.service")
              DESDE=$(systemctl show -p ActiveEnterTimestamp --value "$S.service" | awk '{print $2, $3}')
              REINICIOS=$(systemctl show -p NRestarts --value "$S.service")
              LINHAS=$(sudo -n journalctl -u "$S.service" --since "1 hour ago" -q 2>/dev/null | wc -l)
              if echo "$CAIDOS" | grep -qx "$S"; then MARCA="❌"; ALERTA=1; else MARCA="✅"; fi
              echo "$MARCA $S: $ESTADO desde $DESDE | reinícios sozinho: $REINICIOS | linhas de log na última hora: $LINHAS"
            done

            echo ""
            echo "== Máquina"
            echo "Ligada há: $(uptime -p | sed 's/^up //')"
            echo "Carga (1, 5, 15 min): $(cut -d' ' -f1-3 /proc/loadavg) | núcleos: $(nproc)"
            free -m | awk '/^Mem:/ {printf "Memória: %d de %d MB em uso (%d%%)\n", $3, $2, $3*100/$2}'
            DISCO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            df -h --output=used,size / | tail -1 | awk -v p="$DISCO" '{print "Disco: " $1 " de " $2 " em uso (" p "%)"}'
            if [ "$DISCO" -ge 90 ]; then
              echo "❌ Disco acima de 90%"
              ALERTA=1
            fi

            echo ""
            echo "== Banco"
            for ARQ in banco_dados.db banco_dados.db-wal; do
              [ -f "$ARQ" ] && echo "$ARQ: $(du -h "$ARQ" | cut -f1)"
            done
            CORTE=$(TZ=America/Sao_Paulo date -d '1 hour ago' '+%Y-%m-%d %H:%M:%S')
            ERROS=$(sqlite3 -readonly banco_dados.db "SELECT COUNT(*) FROM erros_logs WHERE timestamp >= '$CORTE'" 2>/dev/null || echo "?")
            echo "Erros registrados na última hora: $ERROS (detalhes no /status do bot)"

            # Links que saíram sem a marcação de afiliado (api_shopee). Só contagens, o robô e
            # o tipo/código do motivo, que o Claude lê nas retomadas para investigar e consertar.
            echo ""
            echo "== Links sem conversão"
            ORIGEM='Link sem conversão'
            JANELAS=""
            for H in 3 12 24; do
              DESDE=$(TZ=America/Sao_Paulo date -d "$H hours ago" '+%Y-%m-%d %H:%M:%S')
              N=$(sqlite3 -readonly banco_dados.db "SELECT COUNT(*) FROM erros_logs WHERE origem = '$ORIGEM' AND timestamp >= '$DESDE'" 2>/dev/null || echo "?")
              JANELAS="$JANELAS últimas $H h: $N |"
            done
            echo "Links sem a marcação de afiliado:${JANELAS%|}"
            sqlite3 -readonly -separator ' · ' banco_dados.db "SELECT json_extract(contexto, '\$.robo'), json_extract(contexto, '\$.tipo') || ' ' || json_extract(contexto, '\$.detalhe'), COUNT(*) || ' link(s)' FROM erros_logs WHERE origem = '$ORIGEM' AND timestamp >= '$DESDE' GROUP BY 1, 2 ORDER BY COUNT(*) DESC" 2>/dev/null | sed 's/^/   /'

            # Robô automático da Shopee Vídeo: só estados, datas e números (nunca título,
            # produto, link ou o motivo de uma parada, que pode ter o nome do produto).
            echo ""
            echo "== Robô da Shopee Vídeo"
            if pgrep -f "[r]obo_shopee_video.py" >/dev/null; then echo "Rodada no celular: rodando agora"; else echo "Rodada no celular: nenhuma agora"; fi
            R=$(sqlite3 -readonly banco_dados.db "SELECT 'Postagem: ' || CASE json_extract(valor, '\$.robo_pausado') WHEN 0 THEN 'ativa' ELSE 'pausada' END || ' | fonte: ' || COALESCE(json_extract(valor, '\$.fonte'), 'autorais') FROM configuracoes WHERE chave = 'shopee_video'" 2>/dev/null)
            echo "${R:-Postagem: pausada (padrão)}"
            R=$(sqlite3 -readonly banco_dados.db "SELECT estado || ': ' || COUNT(*) FROM shopee_video_rascunhos GROUP BY estado" 2>/dev/null | paste -sd ' ' -)
            echo "Rascunhos por estado: ${R:-nenhum}"
            R=$(sqlite3 -readonly -separator ' | ' banco_dados.db "SELECT 'último: ' || estado, 'criado: ' || criado_em, 'origem: ' || COALESCE(fonte, '?') FROM shopee_video_rascunhos ORDER BY id DESC LIMIT 1" 2>/dev/null)
            echo "${R:-nenhum rascunho ainda}"
            R=$(sqlite3 -readonly banco_dados.db "SELECT 'Última rodada: ' || COALESCE(json_extract(valor, '\$.ultima_rodada_em'), '?') || ' → ' || COALESCE(json_extract(valor, '\$.ultima_rodada'), '?') FROM configuracoes WHERE chave = 'shopee_video_robo'" 2>/dev/null)
            echo "${R:-Última rodada: ainda não gravada}"
            # A última legenda que não bateu com o título: por onde leu, tamanhos e códigos
            # de caractere (o robô nunca grava o texto do título aqui).
            R=$(sqlite3 -readonly banco_dados.db "SELECT 'Última legenda que não bateu: ' || json_extract(valor, '\$.ultima_legenda_em') || ' → ' || json_extract(valor, '\$.ultima_legenda') FROM configuracoes WHERE chave = 'shopee_video_robo' AND json_extract(valor, '\$.ultima_legenda') IS NOT NULL" 2>/dev/null)
            if [ -n "$R" ]; then echo "$R"; fi

            # Faxina do Acervo Viral e registro dos administradores: só estados e números.
            # O nome da conta e os nomes dos admins não saem daqui (o log é público).
            echo ""
            echo "== Faxina do Acervo Viral"
            R=$(sqlite3 -readonly -separator ' | ' banco_dados.db "SELECT 'situação: ' || COALESCE(json_extract(valor, '\$.situacao'), '?'), 'última rodada: ' || COALESCE(json_extract(valor, '\$.quando'), '?'), 'vídeos no canal: ' || COALESCE(json_extract(valor, '\$.videos_no_canal'), '?'), 'hoje por idade: ' || COALESCE(json_extract(valor, '\$.apagados_idade_dia'), 0), 'hoje por produto: ' || COALESCE(json_extract(valor, '\$.apagados_produto_dia'), 0), 'antigos na fila: ' || COALESCE(json_extract(valor, '\$.antigos_pendentes'), 0), 'API estranha: ' || COALESCE(json_extract(valor, '\$.api_suspeita'), 0) FROM configuracoes WHERE chave = 'faxina_viral'" 2>/dev/null)
            echo "${R:-ainda não rodou}"
            echo "== Registro dos administradores"
            R=$(sqlite3 -readonly -separator ' | ' banco_dados.db "SELECT 'última conferência: ' || COALESCE(json_extract(valor, '\$.ultima'), '?'), 'grupos e canais: ' || COALESCE(json_extract(valor, '\$.grupos'), '?'), 'admins: ' || COALESCE(json_extract(valor, '\$.admins'), '?') FROM configuracoes WHERE chave = 'registro_admins'" 2>/dev/null)
            echo "${R:-ainda não rodou}"
            N=$(sqlite3 -readonly banco_dados.db "SELECT COUNT(*) FROM admins_mudancas WHERE avisado = 0" 2>/dev/null || echo "?")
            echo "Mudanças de admins esperando aviso: $N"

            exit $ALERTA
