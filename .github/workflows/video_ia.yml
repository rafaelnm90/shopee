name: Vídeo de IA (Shopee Vídeo)

# Teste do vídeo feito por IA a partir da foto do anúncio do produto (pedido do Rafael em
# 25/10, P34): "modelos" mostra os modelos de vídeo (Veo) que a chave do Google enxerga, sem
# custo; "testar" gera 1 vídeo de uns 8 s do próximo produto da fonte do painel e manda só
# no privado do Rafael (custa menos de US$ 1; nada é postado). Só roda quando disparado à mão.
# "flow" é o teste da P229 1 (15/11): o próximo dos 3 vídeos do mesmo produto, um em cada
# modelo do Google Flow, no celular do robô, com os créditos da conta Pro do Rafael (nada é
# postado); "flow-sem-gerar" faz tudo até o Gerar, sem tocar nele (sem gastar crédito).
# "produtos" é a sonda da P234 1 (15/11): o que a API de afiliado devolve com a chave do Rafael em
# cada jeito de pedir a lista de produtos (os em alta, os mais vendidos, os nichos dos Achadinhos), só em
# contagens, para a escolha do produto do vídeo de IA do dia; só lê, não gasta nada.
# "amostra" é o teste da P236 1 (16/11): a próxima amostra do vídeo de IA, como o da produção (o produto
# pela lista da Shopee e o Omni 1.2 Flash, 24 créditos), só no privado do Rafael (nada é postado).
# "amostra-16s" é a amostra da P246 1 (16/11): o vídeo de 16 s com uma pessoa vendendo o produto do começo
# ao fim, nos 8 s gerados e em mais 8 s do Estender do Flow (48 créditos), só no privado do Rafael.
# "amostra-16s-mesmo" é a da P248 1 (17/11): a de 16 s de novo com o produto da amostra anterior, com as
# mudanças contra as alucinações, para o Rafael comparar as duas.
# "amostra-16s-fala-inteira" é a da P255 1 (19/11): a de 16 s com a pessoa falando do começo ao fim de cada parte
# e o parado que sobrar cortado pelo servidor; vão ao privado o vídeo cortado e o original.
# "amostra-16s-maos-e-voz" é a da P261 1 (20/11): a de 16 s no formato mãos e voz, só as mãos usando o produto, sem
# rosto, com uma voz contando do começo ao fim, só no privado do Rafael (o robô só muda com o OK dele).
# "personagens" faz as fotos dos 10 personagens fixos (P250 1 e P258 1) no modo Imagem do Flow, que não gasta
# crédito, e manda cada uma ao privado do Rafael para aprovar; sem "quais", as que faltam; com "quais" (as chaves
# separadas por vírgula, ex.: bonitao,vovo), essas de novo.
# "aprovar-personagens" anota o OK do Rafael às fotos que ele viu no privado (P259 1), dado na conversa com o Claude;
# sem "quais", as 10; com "quais", só essas. Só as aprovadas valem no vídeo de IA; a refeita precisa de um OK novo.
# "imagem-teste" faz a imagem de teste da P253 1: um personagem (o que a IA escolhe pelo produto) com o produto da última
# amostra, no modo Imagem do Flow, sem crédito, só no privado do Rafael (com o OK dele, P260 1, o vídeo de IA do dia já
# começa por uma imagem assim).
#
# O repositório é público, e os logs do Actions também: o video_ia.py e o flow_shopee_video.py
# imprimem só nomes de modelo, estados e números; o produto, o pedido e o vídeo ficam no banco
# e no privado.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [modelos, testar, flow, flow-sem-gerar, produtos, amostra, amostra-16s, amostra-16s-mesmo,
                  amostra-16s-fala-inteira, amostra-16s-maos-e-voz, personagens, aprovar-personagens, imagem-teste]
        default: modelos
      quais:
        description: "Só no personagens (refazer) e no aprovar-personagens: as chaves, separadas por vírgula (ex.: bonitao,vovo); vazio = as que faltam (no aprovar, as 10)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  video_ia:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - name: Vídeo de IA no servidor
        uses: appleboy/ssh-action@master
        env:
          QUAIS: ${{ inputs.quais }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # O flow espera o robô soltar o celular (até 15 min), olha a tela por até 10 min depois do
          # Gerar e espera o Baixar no 1080p por até 5 min. A amostra de 16 s espera também o Estender;
          # a que não acaba no tempo continua na próxima vez, de onde parou.
          command_timeout: 45m
          envs: QUAIS
          script: |
            cd ~/shopee
            case "${{ inputs.acao }}" in
              flow) venv/bin/python3 flow_shopee_video.py teste ;;
              flow-sem-gerar) venv/bin/python3 flow_shopee_video.py teste --sem-gerar ;;
              amostra) venv/bin/python3 flow_shopee_video.py amostra ;;
              amostra-16s) venv/bin/python3 flow_shopee_video.py amostra --longa ;;
              amostra-16s-mesmo) venv/bin/python3 flow_shopee_video.py amostra --longa --mesmo ;;
              amostra-16s-fala-inteira) venv/bin/python3 flow_shopee_video.py amostra --longa --fala-inteira ;;
              amostra-16s-maos-e-voz) venv/bin/python3 flow_shopee_video.py amostra --longa --maos-e-voz ;;
              personagens) venv/bin/python3 flow_shopee_video.py personagens "$QUAIS" ;;
              aprovar-personagens) venv/bin/python3 flow_shopee_video.py aprovar-personagens "$QUAIS" ;;
              imagem-teste) venv/bin/python3 flow_shopee_video.py imagem-teste ;;
              *) venv/bin/python3 video_ia.py ${{ inputs.acao }} ;;
            esac
