name: Vídeo de IA (Shopee Vídeo)

# Teste do vídeo feito por IA a partir da foto do anúncio do produto (pedido do Rafael em
# 25/10, P34): "modelos" mostra os modelos de vídeo (Veo) que a chave do Google enxerga, sem
# custo; "testar" gera 1 vídeo de uns 8 s do próximo produto da fonte do painel e manda só
# no privado do Rafael (custa menos de US$ 1; nada é postado). Só roda quando disparado à mão.
# "flow" é o teste da P229 1 (15/11): o próximo dos 3 vídeos do mesmo produto, um em cada
# modelo do Google Flow, no celular do robô, com os créditos da conta Pro do Rafael (nada é
# postado); "flow-sem-gerar" faz tudo até o Gerar, sem tocar nele (sem gastar crédito).
#
# O repositório é público, e os logs do Actions também: o video_ia.py e o flow_shopee_video.py
# imprimem só nomes de modelo, estados e números; o produto, o pedido e o vídeo ficam no banco
# e no privado.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [modelos, testar, flow, flow-sem-gerar]
        default: modelos

permissions:
  contents: read

jobs:
  video_ia:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Vídeo de IA no servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # O flow espera o robô soltar o celular (até 15 min) e olha a tela por 6 min depois do Gerar.
          command_timeout: 30m
          script: |
            cd ~/shopee
            case "${{ inputs.acao }}" in
              flow) venv/bin/python3 flow_shopee_video.py teste ;;
              flow-sem-gerar) venv/bin/python3 flow_shopee_video.py teste --sem-gerar ;;
              *) venv/bin/python3 video_ia.py ${{ inputs.acao }} ;;
            esac
