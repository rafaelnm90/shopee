name: Avisar o Rafael

# O Claude dispara este workflow para falar com o Rafael no privado do bot principal:
#   aviso       o lembrete diário das pendências (avisar_rafael.py), com assunto curto, ou um
#               pedido de ajuda do Claude (assunto começando com "Pedido de ajuda");
#   pergunta    uma pergunta do Claude, cifrada em "dados" (perguntas_rafael.py cifrar):
#               o servidor guarda, manda na hora e o bot_mestre lembra de hora em hora
#               até ela ser respondida; o log mostra só o código (P1, P2...);
#   respondida  o código da pergunta em "dados": os lembretes param.
#   print       o print da tela final e o 1º quadro do vídeo do rascunho mais novo esperando a
#               aprovação, feito desde "dados" (AAAA-MM-DDTHH:MM, opcional), para o Rafael conferir a
#               capa (robo_shopee_video.py --print-do-rascunho); o log mostra só o horário do rascunho.
#   acesso      um dado do Acessos do Servidor 🔐 que o Rafael passou ao Claude (ex.: onde está a
#               senha da cópia do backup), cifrado em "dados" (painel_acessos.py cifrar): o servidor
#               guarda e avisa o Rafael; o log mostra só o nome do serviço.
# Só roda à mão (run_workflow).
#
# O repositório é público, e os logs e as entradas do Actions também: o assunto vai
# em poucas palavras, sem dado privado, e a pergunta e o acesso vão cifrados com a chave do servidor.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "aviso (lembrete diário ou pedido de ajuda), pergunta (nova, cifrada), respondida, print (do rascunho mais novo) ou acesso (cifrado)"
        required: false
        type: choice
        options: [aviso, pergunta, respondida, print, acesso]
        default: aviso
      assunto:
        description: "Só no aviso: assunto em poucas palavras e sem dado privado"
        required: false
        type: string
      link:
        description: "Só no aviso: link da sessão do Claude (opcional)"
        required: false
        type: string
      dados:
        description: "pergunta e acesso: o texto cifrado; respondida: o código (ex.: P3); print: desde quando (AAAA-MM-DDTHH:MM)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mensagem no privado pelo bot
        uses: appleboy/ssh-action@master
        env:
          ACAO: ${{ inputs.acao }}
          ASSUNTO: ${{ inputs.assunto }}
          LINK: ${{ inputs.link }}
          DADOS: ${{ inputs.dados }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: ACAO,ASSUNTO,LINK,DADOS
          command_timeout: 2m
          script: |
            cd ~/shopee
            case "$ACAO" in
              pergunta) venv/bin/python3 perguntas_rafael.py nova "$DADOS" ;;
              respondida) venv/bin/python3 perguntas_rafael.py respondida "$DADOS" ;;
              print) venv/bin/python3 robo_shopee_video.py --print-do-rascunho "$DADOS" ;;
              acesso) venv/bin/python3 painel_acessos.py guardar "$DADOS" ;;
              *) venv/bin/python3 avisar_rafael.py "$ASSUNTO" "$LINK" ;;
            esac
