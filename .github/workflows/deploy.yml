name: Deploy Automatico

on:
  push:
    branches:
      - main
      - master

jobs:
  # Portão: o deploy só roda se a checagem completa passar (a mesma dos PRs:
  # validador, pyflakes, autotestes e tests/). Com os dois em paralelo, um
  # validador vermelho não impedia o servidor de reiniciar com código quebrado.
  validar:
    uses: ./.github/workflows/validar.yml

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar Servidor Oracle via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Acessa a pasta exata onde o bot está no servidor
            cd ~/shopee
            
            # Commit que estava no ar: o que mudou desde ele decide quem reinicia.
            ANTES=$(git rev-parse HEAD 2>/dev/null || echo desconhecido)

            # Sincroniza o código com o GitHub forçando a cópia exata
            git fetch --all
            # 📌 Sobe EXATAMENTE o commit que o job 'validar' aprovou. Com origin/main,
            # um deploy aprovado podia puxar um commit mais novo que chegou enquanto ele
            # estava na fila do Actions — foi assim que código quebrado passou pelo portão.
            git reset --hard ${{ github.sha }}
            
            # Atualiza as bibliotecas se houver mudanças
            source venv/bin/activate
            pip install -r requirements.txt --no-cache-dir
            # Bibliotecas que saíram do requirements.txt porque nenhum código usa: o
            # pip install não as remove sozinho. Depois que saíram, não faz nada.
            pip uninstall -y -q google-generativeai google-ai-generativelanguage google-api-python-client \
              google-api-core google-auth-httplib2 googleapis-common-protos grpcio grpcio-status \
              httplib2 proto-plus protobuf tqdm uritemplate 2>/dev/null || true
            
            # Recarrega as configurações do sistema caso algum .service tenha sido alterado no GitHub
            sudo systemctl daemon-reload
            
            # Reinicia só os robôs cujo código mudou (o arquivo deles ou um módulo que
            # importam): cada reinício derruba os painéis abertos e refaz a grade do
            # dia. Mudança só em documentação, testes ou workflows não reinicia
            # ninguém. Na dúvida (requirements, o mesmo commit de novo, erro no
            # seletor), todos. Robô que estava parado reinicia sempre.
            SERVICOS="bot_mestre_bot divulgacao_canal_bot motor_userbot_bot espelhador_videos_autorais_bot downloader_bot"
            if ! MUDARAM=$(python3 servicos_afetados.py "$ANTES" "${{ github.sha }}"); then
              MUDARAM=$(echo $SERVICOS | tr ' ' '\n')
            fi
            REINICIADOS=""
            for SERVICO in $SERVICOS; do
              if echo "$MUDARAM" | grep -qx "$SERVICO" || ! systemctl is-active --quiet "$SERVICO.service"; then
                echo "🔄 Reiniciando $SERVICO..."
                sudo systemctl stop "$SERVICO.service" || true
                sudo systemctl kill -s SIGKILL "$SERVICO.service" || true
                sudo systemctl start "$SERVICO.service"
                REINICIADOS="$REINICIADOS $SERVICO"
              else
                echo "⏭️ $SERVICO sem mudança no código: continua rodando"
              fi
            done

            # Confere se os robôs ficaram de pé. Robô que cai logo ao iniciar
            # (erro de import, .env faltando) fica em "activating" no Restart=always:
            # o deploy fica vermelho e mostra o tipo do último erro de quem caiu.
            # Só o tipo: o log dos robôs tem nomes de grupos, contas e links, e o log
            # do Actions é público. O resto do log fica só no servidor.
            ultimo_erro() {
              TIPO=$(sudo journalctl -u "$1.service" -n 80 --no-pager -o cat 2>/dev/null \
                | grep -oE '^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Interrupt)\b' | tail -1)
              echo "   último erro no log: ${TIPO:-nenhum reconhecido}"
            }
            if [ -n "$REINICIADOS" ]; then sleep 25; fi
            FALHOU=0
            for SERVICO in $SERVICOS; do
              if systemctl is-active --quiet "$SERVICO.service"; then
                echo "✅ $SERVICO ativo"
              else
                echo "❌ $SERVICO NÃO está ativo ($(systemctl is-active "$SERVICO.service"))"
                ultimo_erro "$SERVICO"
                FALHOU=1
              fi
            done

            # Confere de novo 3 min depois. Com Restart=always, o robô que cai depois de
            # subir (no primeiro agendamento, na conexão com o Telegram) volta sozinho em
            # 10 s e parece "ativo" numa olhada só. Processo novo (MainPID) ou reinício
            # contado (NRestarts) desde a 1ª olhada = caiu nesse meio-tempo.
            if [ $FALHOU -eq 0 ] && [ -n "$REINICIADOS" ]; then
              RETRATO=""
              for SERVICO in $SERVICOS; do
                RETRATO="$RETRATO $SERVICO:$(systemctl show -p MainPID --value "$SERVICO.service"):$(systemctl show -p NRestarts --value "$SERVICO.service")"
              done
              echo "⏳ Conferindo de novo em 3 minutos..."
              sleep 180
              for ITEM in $RETRATO; do
                SERVICO=${ITEM%%:*}; RESTO=${ITEM#*:}
                PID_ANTES=${RESTO%%:*}; REINICIOS_ANTES=${RESTO#*:}
                PID_AGORA=$(systemctl show -p MainPID --value "$SERVICO.service")
                REINICIOS_AGORA=$(systemctl show -p NRestarts --value "$SERVICO.service")
                if systemctl is-active --quiet "$SERVICO.service" && [ "$PID_AGORA" = "$PID_ANTES" ] && [ "$REINICIOS_AGORA" = "$REINICIOS_ANTES" ]; then
                  echo "✅ $SERVICO continua de pé 3 min depois"
                else
                  echo "❌ $SERVICO caiu depois de subir (processo $PID_ANTES -> $PID_AGORA, reinícios $REINICIOS_ANTES -> $REINICIOS_AGORA)"
                  ultimo_erro "$SERVICO"
                  FALHOU=1
                fi
              done
            fi

            echo "🚪 Encerrando a conexão SSH de forma limpa..."
            exit $FALHOU
