name: Android virtual (Shopee Vídeo)

# O Android virtual onde o robô da Shopee Vídeo opera o app (android_virtual.py).
# Só roda à mão. Ações:
#   estado          só mostra como está;
#   preparar        instala o Docker e o adb, carrega o binder e liga o Android
#                   (só o que falta);
#   instalar-shopee baixa e instala (ou atualiza) o app da Shopee;
#   tela            abre a tela do Android no navegador por 30 min; o link vai
#                   só no privado do Rafael, pelo bot.
#
# O repositório é público, e os logs do Actions também: o android_virtual.py
# imprime só estados e números, nunca o link da tela.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [estado, preparar, instalar-shopee, tela]
        default: estado

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Android virtual no servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 25m
          script: |
            cd ~/shopee
            venv/bin/python3 android_virtual.py ${{ inputs.acao != 'estado' && format('--{0}', inputs.acao) || '' }}
